cube: CST Account Config
rule: |
  SKIPCHECK;
  FEEDSTRINGS;

  FEEDERS;

  # Feed Amount in Stage 1 — stored at Cost Pool='Input' in Account Config.
  ['CST Account Config Measure':'Amount','CST Cost Pool':'Input'] =>
    DB('CST Account to Pool Apportionment', !GBL Period, !GBL Version,
       !CST Cost Pool, !GBL Cost Centre, !GBL Account, 'Amount');

  # Feed Apportionment Rate and Apportioned Amount in Stage 1.
  # Driver Percentage Share is stored per (account, cc, pool) — exact Cost Pool known.
  ['CST Account Config Measure':'Driver Percentage Share'] =>
    DB('CST Account to Pool Apportionment', !GBL Period, !GBL Version,
       !CST Cost Pool, !GBL Cost Centre, !GBL Account, 'Apportionment Rate'),
    DB('CST Account to Pool Apportionment', !GBL Period, !GBL Version,
       !CST Cost Pool, !GBL Cost Centre, !GBL Account, 'Apportioned Amount');

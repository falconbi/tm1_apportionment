cube: CST Activity to Activity Apportionment
views:
  - view_name: RPT Default
    set_as_default: true
    mdx: |
      SELECT
      NON EMPTY CROSSJOIN(TM1FILTERBYLEVEL({TM1SUBSETALL([GBL Cost Centre])}, 0), TM1FILTERBYLEVEL({TM1SUBSETALL([CST Activity Dest])}, 0)) ON COLUMNS,
      NON EMPTY TM1FILTERBYLEVEL({TM1SUBSETALL([CST Activity])}, 0) ON ROWS
      FROM [CST Activity to Activity Apportionment]
      WHERE ([GBL Version].[Budget],
             [GBL Period].[Apr FY2025],
             [CST Activity to Activity Apportionment Measure].[Apportioned Amount])

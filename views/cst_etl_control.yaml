cube: CST ETL Control
views:
  - view_name: RPT Job Status
    set_as_default: true
    mdx: |
      SELECT
      NON EMPTY {
        [CST ETL Control Measure].[Status],
        [CST ETL Control Measure].[Period],
        [CST ETL Control Measure].[Version],
        [CST ETL Control Measure].[Message],
        [CST ETL Control Measure].[Requested At],
        [CST ETL Control Measure].[Completed At]
      } ON 0,
      NON EMPTY {
        [CST ETL Job].[Load GL],
        [CST ETL Job].[Load Drivers],
        [CST ETL Job].[Run Apportionment]
      } ON 1
      FROM [CST ETL Control]

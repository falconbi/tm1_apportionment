cube: CST Pool to Pool Apportionment
views:
  - view_name: RPT Default
    set_as_default: true
    mdx: |
      SELECT
      NON EMPTY CROSSJOIN(TM1FILTERBYLEVEL({TM1SUBSETALL([GBL Cost Centre])}, 0), TM1FILTERBYLEVEL({TM1SUBSETALL([CST Cost Pool Dest])}, 0)) ON COLUMNS,
      NON EMPTY TM1FILTERBYLEVEL({TM1SUBSETALL([CST Cost Pool])}, 0) ON ROWS
      FROM [CST Pool to Pool Apportionment]
      WHERE ([GBL Version].[Budget],
             [GBL Period].[Apr FY2025],
             [CST Pool to Pool Apportionment Measure].[Apportioned Amount])

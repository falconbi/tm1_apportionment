cube: CST Account Config
views:
  - view_name: RPT Default
    set_as_default: true
    mdx: |
      SELECT
      NON EMPTY {
        STRTOMEMBER("[GBL Period].[" + [GBL Version].CURRENTMEMBER.PROPERTIES("Start Period") + "]")
        :
        STRTOMEMBER("[GBL Period].[" + [GBL Version].CURRENTMEMBER.PROPERTIES("End Period") + "]")
      } ON 0,
      NON EMPTY {
        TM1FILTERBYLEVEL(TM1SUBSETALL([GBL Account]), 0)
      } * {
        TM1FILTERBYLEVEL(TM1SUBSETALL([GBL Cost Centre]), 0)
      } * {
        [CST Cost Pool].[CST Cost Pool].MEMBERS
      } ON 1
      FROM [CST Account Config]
      WHERE (
        [GBL Version].[GBL Version].[Forecast],
        [CST Account Config Measure].[CST Account Config Measure].[Driver Percentage Share]
      )

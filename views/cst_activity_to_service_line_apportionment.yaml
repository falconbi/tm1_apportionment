cube: CST Activity to Service Line Apportionment
views:
  - view_name: RPT Default
    set_as_default: true
    mdx: |
      SELECT
      NON EMPTY {
        STRTOMEMBER("[GBL Period].[" + [GBL Version].CURRENTMEMBER.PROPERTIES("Start Period") + "]")
        :
        STRTOMEMBER("[GBL Period].[" + [GBL Version].CURRENTMEMBER.PROPERTIES("End Period") + "]")
      } ON 0,
      NON EMPTY {
        [CST Activity].[CST Activity].MEMBERS
      } * {
        [CST Service Line].[CST Service Line].MEMBERS
      } ON 1
      FROM [CST Activity to Service Line Apportionment]
      WHERE (
        [GBL Version].[GBL Version].[Budget],
        [CST Activity to Service Line Apportionment Measure].[CST Activity to Service Line Apportionment Measure].[Apportioned Amount],
        [GBL Cost Centre].[GBL Cost Centre].[Total Cost Centres]
      )

name: CST Load Drivers
parameters:
  - name: pPeriod
    prompt: "Period e.g. 2025-04 — leave blank to load all periods for the version"
    default: ""
    type: String
  - name: pVersion
    prompt: Version
    default: Budget
    type: String

prolog: |
  sCube = 'CST ETL Control';
  sJob  = 'Load Drivers';

  CellPutS( pPeriod,  sCube, sJob, 'Period'  );
  CellPutS( pVersion, sCube, sJob, 'Version' );
  CellPutS( 'REQUESTED', sCube, sJob, 'Status' );
